{{define "content"}}
	<h1>{{$.Tr "Lists"}}</h1>
	{{with .PublicLists}}
		<table class="table">
			<thead>
				<tr>
					<th>{{$.Tr "Address"}}</th>
					<th>{{$.Tr "Name"}}</th>
					<th></th>
				</tr>
			</thead>
			<tbody>
				{{range .}}
					<tr>
						<td>{{.RFC5322AddrSpec}}</td>
						<td>{{.Display}}</td>
						<td>
							{{if not (index $.MyLists .RFC5322AddrSpec)}}
								<a href="/join/{{PathEscape .RFC5322AddrSpec}}">Join</a>
							{{end}}
						</td>
					</tr>
				{{end}}
			</tbody>
		</table>
	{{else}}
		<p>{{$.Tr "No lists."}}</p>
	{{end}}
{{end}}
