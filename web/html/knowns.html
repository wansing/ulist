{{define "content"}}
	{{template "list-tabs" .}}
	<form method="post">
		<div class="form-group">
			<label>{{$.Tr "Email addresses (up to %v, one RFC 5322 address-list per line)" BatchLimit}}</label>
			<textarea name="emails" class="form-control" placeholder="Email addresses"></textarea> <!-- TODO is not preserved across errors at the moment -->
		</div>
		<button name="add" value="1" type="submit" class="btn btn-primary">{{$.Tr "Add senders"}}</button>
		<button name="remove" value="1" type="submit" class="btn btn-danger">{{$.Tr "Remove senders"}}</button>
	</form>
	{{with .Knowns}}
		<h2>{{$.Tr "Known Senders"}}</h2>
		<ul>
			{{range .}}
				<li>{{.}}</li>
			{{end}}
		</ul>
	{{end}}
{{end}}
