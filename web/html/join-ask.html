{{define "content"}}
	<h1>{{$.Tr "Join %s" .ListAddress}}</h1>
	<p>{{$.Tr "In order to join, please enter your email address. We will send a confirmation link to your email address."}}</p>
	<form action="" method="post">
		<div class="form-group">
			<label>{{$.Tr "Email address"}}</label>
			<input name="email" type="email" class="form-control" placeholder="Email address" value="{{.Email}}">
		</div>
		<div class="form-group" style="display: none;">
			{{CreateCaptcha}}
		</div>
		<button name="join" value="1" type="submit" class="btn btn-primary">{{$.Tr "Get confirmation link"}}</button>
	</form>
{{end}}
