{{define "content"}}
	<h1>{{$.Tr "Create a new mailing list"}}</h1>
	<form action="" method="post">
		<div class="form-group">
			<label>{{$.Tr "List address (domain must be configured on this server)"}}</label>
			<input name="address" type="email" class="form-control" placeholder="{{$.Tr "List address"}}" value="{{.Address}}">
		</div>
		<div class="form-group">
			<label>{{$.Tr "List name"}}</label>
			<input name="name" type="text" class="form-control" placeholder="{{$.Tr "List name"}}" value="{{.Name}}">
		</div>
		<div class="form-group">
			<label>{{$.Tr "Members which can administrate and moderate"}}</label>
			<textarea name="admin_mods" type="email" class="form-control" placeholder="{{$.Tr "Members which can administrate and moderate"}}">{{.AdminMods}}</textarea>
		</div>
		<button name="add" value="1" type="submit" class="btn btn-primary">{{$.Tr "Create list"}}</button>
	</form>
{{end}}
