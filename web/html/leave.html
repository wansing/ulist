{{define "content"}}
	{{template "list-tabs" .}}
	<form method="post">
		<div class="form-check mb-3">
			<input class="form-check-input" type="checkbox" name="confirm-leave" value="1" id="confirm-leave">
			<label class="form-check-label" for="confirm-leave">
				{{$.Tr "Remove me (%s) from list %s" .Email .ListAddress}}.
			</label>
		</div>
		<button type="submit" class="btn btn-primary">{{$.Tr "Leave"}}</button>
	</form>
{{end}}
